{% extends "base.html" %}

{% block title %}Register — Campus Lost & Found{% endblock %}

{% block content %}
<div class="auth-card-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Create Campus Account</h2>
            <p class="text-muted">Register to report items and schedule claim verification</p>
        </div>

        <form action="{{ url_for('auth.register') }}" method="POST" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Anshu Kala" required autofocus>
            </div>

            <div class="form-group">
                <label for="roll_no">Roll Number / Student ID</label>
                <input type="text" id="roll_no" name="roll_no" class="form-control" placeholder="e.g. 2024CS01" required>
            </div>

            <div class="form-group">
                <label for="email">Campus Email</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="e.g. anshu@campus.edu" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Create a secure password (min 8 characters)" required minlength="8">
            </div>

            <button type="submit" class="btn btn-primary btn-block">Complete Registration</button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="{{ url_for('auth.login') }}">Sign In</a></p>
        </div>
    </div>
</div>
{% endblock %}
